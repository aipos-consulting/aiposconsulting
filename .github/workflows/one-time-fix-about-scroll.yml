name: One-time site fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-about-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace("import { useState } from 'react'", "import { useEffect, useState } from 'react'")
          s = s.replace("consultant: '대표컨설턴트', achievements: '주요 실적', differentiator:", "consultant: '대표컨설턴트', achievements: '주요 실적', achievementItems: ['에잇투서울 LAYAD Beauty Code MVP 개발','KDN AI Data Center Platform 마스터플랜 설계 참여'], differentiator:")
          s = s.replace("consultant: 'Principal Consultant', achievements: 'Key Experience', differentiator:", "consultant: 'Principal Consultant', achievements: 'Key Experience', achievementItems: ['Eight to Seoul LAYAD Beauty Code MVP Development','KDN AI Data Center Platform Master Plan Design'], differentiator:")
          s = s.replace("consultant: '代表コンサルタント', achievements: '主な実績', differentiator:", "consultant: '代表コンサルタント', achievements: '主な実績', achievementItems: ['Eight to Seoul LAYAD Beauty Code MVP開発','KDN AI Data Center Platform マスタープラン設計'], differentiator:")
          s = s.replace("consultant: '首席顾问', achievements: '主要业绩', differentiator:", "consultant: '首席顾问', achievements: '主要业绩', achievementItems: ['Eight to Seoul LAYAD Beauty Code MVP开发','KDN AI Data Center Platform总体规划设计'], differentiator:")
          s = s.replace("  const t = copy[lang]\n\n  const TabButton", "  const t = copy[lang]\n\n  useEffect(() => {\n    window.scrollTo({ top: 0, left: 0, behavior: 'auto' })\n  }, [active])\n\n  const TabButton")
          old = '<ul className="mt-4 space-y-3 text-muted"><li className="flex gap-3"><CheckCircle2 className="mt-0.5 shrink-0 text-teal" size={18}/>에잇투서울 LAYAD Beauty Code MVP 개발</li><li className="flex gap-3"><CheckCircle2 className="mt-0.5 shrink-0 text-teal" size={18}/>KDN AI Data Center Platform 마스터플랜 설계 참여</li></ul>'
          new = '<ul className="mt-4 space-y-3 text-muted">{t.achievementItems.map((item) => <li key={item} className="flex gap-3"><CheckCircle2 className="mt-0.5 shrink-0 text-teal" size={18}/>{item}</li>)}</ul>'
          if old not in s:
              raise SystemExit('Expected achievements block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: git rm .github/workflows/one-time-fix-about-scroll.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Localize achievements and reset scroll on tab change"
          git push
